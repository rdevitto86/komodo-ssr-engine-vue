version: "3.8"

services:
  komodo-ssr-engine-vue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: komodo-ssr-engine-vue
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
